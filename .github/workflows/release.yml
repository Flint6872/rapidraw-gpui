name: Release Automation

on:
  workflow_dispatch:
  push:
    tags:
      - "v*" # Triggers automatically when you push a tag like v1.0.0

permissions:
  contents: write

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  build-and-release:
    name: Build for ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # --- Desktop Targets ---
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            archive_name: rapidraw-linux-x86_64.tar.gz
            binary_name: rapidraw-gpui
            platform: linux

          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive_name: rapidraw-linux-aarch64.tar.gz
            binary_name: rapidraw-gpui
            platform: linux

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive_name: rapidraw-windows.zip
            binary_name: rapidraw-gpui.exe
            platform: windows

          - os: macos-15
            target: universal-apple-darwin
            archive_name: rapidraw-macos.dmg
            binary_name: rapidraw-gpui
            platform: macos

          # --- Mobile Targets ---
          - os: ubuntu-22.04
            target: aarch64-linux-android
            archive_name: rapidraw-android-arm64.tar.gz
            binary_name: librapidraw_gpui.so
            platform: android

          - os: macos-15
            target: aarch64-apple-ios
            archive_name: rapidraw-ios-arm64.tar.gz
            binary_name: librapidraw_gpui.a
            platform: ios

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      # Install Rust toolchains depending on target
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: >-
            ${{ matrix.platform == 'macos' && 'aarch64-apple-darwin x86_64-apple-darwin' ||
                matrix.platform == 'ios' && 'aarch64-apple-ios aarch64-apple-ios-sim' ||
                matrix.target }}

      # Speeds up subsequent compilation tasks
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      # Setup Android NDK and cargo-ndk for Android cross-compilation
      - name: Setup Android NDK & cargo-ndk
        if: matrix.platform == 'android'
        run: |
          cargo install cargo-ndk
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV

      # Linux dependencies
      - name: Install dependencies (Linux only)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
                libgtk-3-dev \
                libxcb-shape0-dev \
                libxcb-xfixes0-dev \
                libxkbcommon-dev \
                libxkbcommon-x11-dev \
                libwayland-dev \
                pkg-config \
                libssl-dev \
                libfontconfig1-dev \
                libfreetype6-dev \
                fontconfig \
                libzstd-dev \
                libbz2-dev
        env:
          RUST_FONTCONFIG_DLOPEN: "on"

      # Compiles targets properly
      - name: Build Release Binary
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "macos" ]; then
            cargo build --release -p rapidraw-gpui --target aarch64-apple-darwin
            cargo build --release -p rapidraw-gpui --target x86_64-apple-darwin

            mkdir -p target/universal-apple-darwin/release
            lipo -create \
              target/aarch64-apple-darwin/release/rapidraw-gpui \
              target/x86_64-apple-darwin/release/rapidraw-gpui \
              -output target/universal-apple-darwin/release/rapidraw-gpui

          elif [ "${{ matrix.platform }}" = "android" ]; then
            cargo ndk -t arm64-v8a build --release -p rapidraw-gpui

          elif [ "${{ matrix.platform }}" = "ios" ]; then
            cargo build --release -p rapidraw-gpui --target aarch64-apple-ios

          else
            cargo build --release -p rapidraw-gpui --target ${{ matrix.target }}
          fi

      # Packages and structures payload properly
      - name: Package Directory and Compress
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "macos" ]; then
            mkdir -p RapidRAW.app/Contents/MacOS
            mkdir -p RapidRAW.app/Contents/Resources
            cp target/universal-apple-darwin/release/rapidraw-gpui RapidRAW.app/Contents/MacOS/

            echo '<?xml version="1.0" encoding="UTF-8"?>
            <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
            <plist version="1.0">
            <dict>
                <key>CFBundleExecutable</key>
                <string>rapidraw-gpui</string>
                <key>CFBundleIdentifier</key>
                <string>com.rapidraw.app</string>
                <key>CFBundleName</key>
                <string>RapidRAW</string>
                <key>CFBundlePackageType</key>
                <string>APPL</string>
                <key>CFBundleShortVersionString</key>
                <string>0.0.1</string>
            </dict>
            </plist>' > RapidRAW.app/Contents/Info.plist

            mkdir dmg-staging
            mv RapidRAW.app dmg-staging/
            ln -s /Applications dmg-staging/Applications
            hdiutil create -fs HFS+ -srcfolder dmg-staging -volname "RapidRAW" ${{ matrix.archive_name }}

          elif [ "${{ matrix.platform }}" = "android" ]; then
            mkdir -p android-payload
            cp target/aarch64-linux-android/release/librapidraw_gpui.so android-payload/
            tar -czf ${{ matrix.archive_name }} -C android-payload .

          elif [ "${{ matrix.platform }}" = "ios" ]; then
            mkdir -p ios-payload
            cp target/aarch64-apple-ios/release/librapidraw_gpui.a ios-payload/
            tar -czf ${{ matrix.archive_name }} -C ios-payload .

          elif [ "${{ matrix.platform }}" = "windows" ]; then
            mkdir payload
            cp target/${{ matrix.target }}/release/${{ matrix.binary_name }} payload/
            powershell -Command "Compress-Archive -Path payload/* -DestinationPath ${{ matrix.archive_name }}"

          else
            mkdir payload
            cp target/${{ matrix.target }}/release/${{ matrix.binary_name }} payload/
            tar -czf ${{ matrix.archive_name }} -C payload .
          fi

      # Publish Artifacts
      - name: Publish Artifacts to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = '${{ matrix.archive_name }}';

            const tag = context.ref.replace('refs/tags/', '');
            let release;
            try {
              release = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: tag,
              });
            } catch (e) {
              release = await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: tag,
                name: tag,
                draft: false,
                prerelease: false,
              });
            }

            await github.rest.repos.uploadReleaseAsset({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.data.id,
              name: path,
              data: fs.readFileSync(path),
            });
