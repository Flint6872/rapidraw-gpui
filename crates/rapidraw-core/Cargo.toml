[package]
name = "rapidraw-core"
version = "0.0.1"
edition = "2024"

[dependencies]
# RAW file decoding
rawler = "0.8"
dng = "1.6"

# Multi-threaded mathematical computation
rayon = "1.12"
ndarray = "0.17"

# Managing JSON adjustments and metadata sidecar tracking
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
image = "0.25" # Basic pixel handling types
